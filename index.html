<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f6ef7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="经济师刷题">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>经济师刷题 · 人力资源管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="data.js"></script>
<div id="app">
  <header id="topbar">
    <button id="btn-back" class="icon-btn" hidden aria-label="返回">‹</button>
    <div id="topbar-title">章节</div>
    <div id="topbar-right"></div>
  </header>
  <main id="view"></main>
  <nav id="tabbar">
    <button class="tab long" data-tab="chapters">
      <svg viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h5v16H6a2 2 0 0 1-2-2V6zm9-2h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5V4z"/></svg>
      <span>人力资源管理</span>
    </button>
    <button class="tab" data-tab="econ">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v5c0 1.66 3.13 3 7 3s7-1.34 7-3V6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 11v5c0 1.66 3.13 3 7 3s7-1.34 7-3v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>经济基础</span>
    </button>
    <button class="tab" data-tab="review">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm-1 5h2v2h-2V8zm0 4h2v5h-2v-5z" transform="translate(12 12) rotate(45) translate(-12 -12)"/></svg>
      <span>复习</span>
    </button>
    <button class="tab" data-tab="wrong">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 16H3L12 3zm-1 6v5h2V9h-2zm0 7v2h2v-2h-2z"/></svg>
      <span>错题本</span>
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24"><path d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/></svg>
      <span>统计</span>
    </button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
